<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234255ff'><path d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VocabMaster - Ứng dụng học từ vựng tiếng Anh với Flashcards, Trắc nghiệm, Luyện gõ từ và Theo dõi tiến trình." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>VocabMaster - Học Từ Vựng Tiếng Anh</title>
    <style>
      #app-boot-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        color: #0f172a;
        background: #f8fafc;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        text-align: center;
      }

      #app-boot-fallback .boot-spinner {
        width: 38px;
        height: 38px;
        border: 4px solid #cbd5e1;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      #app-boot-fallback[data-state="error"] .boot-spinner {
        display: none;
      }

      #app-boot-retry {
        display: none;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #4f46e5;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #app-boot-fallback[data-state="error"] #app-boot-retry {
        display: inline-flex;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-fallback" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <strong>VocabMaster</strong>
        <p id="app-boot-message">Đang tải ứng dụng...</p>
        <button id="app-boot-retry" type="button" onclick="window.location.reload()">
          Tải lại trang
        </button>
      </div>
    </div>
    <noscript>Bạn cần bật JavaScript để sử dụng VocabMaster.</noscript>
    <script>
      (() => {
        const showBootError = () => {
          const fallback = document.getElementById('app-boot-fallback');
          if (!fallback) return;

          fallback.dataset.state = 'error';
          const message = document.getElementById('app-boot-message');
          if (message) {
            message.textContent = 'Không thể tải giao diện. Vui lòng tải lại trang hoặc mở bằng cửa sổ ẩn danh.';
          }
        };

        window.addEventListener('error', showBootError, { once: true });
        window.addEventListener('unhandledrejection', showBootError, { once: true });
        window.setTimeout(showBootError, 20000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
