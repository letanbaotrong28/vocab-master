[build]
  command = "npm run build"
  publish = "dist"

# Netlify frontend proxy to the current Render backend.
# Update this URL if the Render service name changes.
[[redirects]]
  from = "/api/*"
  to = "https://vocab-master-z1et.onrender.com/api/:splat"
  status = 200
  force = true

# Redirects for React Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
